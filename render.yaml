# Render Blueprint — one web service that builds the React frontend and serves
# it together with the Socket.IO backend, so a single https://….onrender.com
# link works on a phone (HTTPS is what lets phones share GPS).
#
# Needs this folder pushed to a GitHub repo (see README, "Deploying"). Secrets
# are marked sync:false — Render asks for them in the dashboard; they are never
# stored in this file.
services:
  - type: web
    name: ambulance-corridor
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # SERVER key: Directions API only. Restrict it by API, not by website
      # (a server has no referrer).
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # BROWSER key: Maps JavaScript API + Places API. It is baked into the
      # built page (visible to anyone), so restrict it to your site's address
      # (HTTP referrer) in Google Cloud. Must be set BEFORE the build runs.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      # Lets you read /devices, /history, /violations, /api-usage with
      # ?token=<this>. Without it those endpoints are off in production.
      - key: ADMIN_TOKEN
        generateValue: true
      # Hard daily ceiling on Directions calls, so a shared link can't spend
      # your quota. 0 = unlimited.
      - key: DIRECTIONS_DAILY_LIMIT
        value: "1500"
